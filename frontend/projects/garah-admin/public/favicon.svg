<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>GARAH</title>
  <!--
    La marque, en coupe pour les petites tailles.

    /!\ L'ANSE EST PLUS EPAISSE ICI QUE DANS marque.svg : 6,2 au lieu de 5.

        A 16 px, un trait de 5 unites sur une grille de 48 tombe a 1,7 pixel
        physique. Le navigateur l'etale sur deux rangees a demi allumees et
        l'anse devient un halo : la marque n'a plus de contour, juste une
        tache. A 6,2 le trait couvre franchement ses deux pixels.

        Ce n'est pas une seconde marque, c'est la meme a une autre echelle —
        exactement ce que fait une fonte avec ses coupes de petit corps. Ne
        pas "harmoniser" les deux valeurs : ce serait casser l'une des deux.

    Le .ico reste a cote pour les navigateurs anciens ; index.html declare
    les deux, et celui qui comprend le SVG le choisit.
  -->
  <path d="M10 25A15 15 0 0 1 37.29 16.4" fill="none" stroke="#12a594"
        stroke-width="6.2" stroke-linecap="butt"/>
  <path d="M10 25A15 15 0 0 0 40 25Z" fill="#12a594"/>
</svg>
