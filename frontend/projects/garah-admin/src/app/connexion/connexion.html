<div class="connexion">
  <button type="button" class="bascule-theme" (click)="theme.basculer()">
    <gu-icone [nom]="theme.sombreEffectif() ? 'sun' : 'moon'" />
    @if (theme.sombreEffectif()) { Clair } @else { Sombre }
  </button>

  <header class="entete-marque">
    <!-- L'emblème est DÉCORATIF : le nom est écrit juste en dessous, et
         l'annoncer ferait entendre « GARAH GARAH » au lecteur d'écran.

         Il s'anime une fois, à l'ouverture : c'est le seul écran où l'on
         arrive sans rien avoir demandé, donc le seul où un mouvement
         n'interrompt personne. -->
    <gu-marque class="embleme" taille="5rem" animee="entree" />

    <h1 class="titre">GARAH</h1>
    <!-- ⚠️ Le slogan MANQUAIT ici. Il avait ete pose dans la barre laterale,
         mais l ecran de connexion est la PREMIERE chose que voit un nouveau
         membre de l equipe — et la seule page du back-office que voient ceux
         qui n ont pas encore de compte. -->
    <p class="slogan">Au-delà des frontières</p>
    <p class="sous-titre">Administration</p>

    <p class="accroche">
      Plateforme de commerce, de service client et de logistique.
      Connectez-vous pour accéder à l'administration.
    </p>
  </header>

  <div class="connexion__panneau gu-carte">
    <!-- Pourquoi on se retrouve ici. Affiché AU-DESSUS du formulaire, pas
         sous le bouton : c'est ce qu'il faut lire avant de se demander
         pourquoi on a été déconnecté.

         `role="status"` et non `role="alert"` : rien n'a échoué, on informe. -->
    @if (avis(); as message) {
      <p class="avis" role="status">
        <gu-icone nom="check" />
        <span>{{ message }}</span>
      </p>
    }

    <!-- novalidate : on veut NOS messages, pas les bulles du navigateur, qui
         ne sont ni traduites, ni stylables, ni annoncées de la même façon
         par tous les lecteurs d'écran. -->
    <form (ngSubmit)="soumettre()" novalidate>
      <label class="gu-libelle" for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" class="gu-champ"
             autocomplete="username" required
             [ngModel]="email()" (ngModelChange)="email.set($event)" />

      <label class="gu-libelle" for="mdp">Mot de passe</label>
      <input id="mdp" name="motDePasse" type="password" class="gu-champ"
             autocomplete="current-password" required
             [ngModel]="motDePasse()" (ngModelChange)="motDePasse.set($event)" />

      @if (erreur(); as message) {
        <!-- role="alert" : l'erreur est annoncée sans que l'utilisateur ait à
             la chercher. -->
        <p class="alerte" role="alert">{{ message }}</p>
      }

      <button type="submit" class="gu-btn gu-btn--primaire plein"
              [disabled]="enCours() || !email() || !motDePasse()">
        @if (enCours()) {
          <gu-icone nom="circle-notch" tourne /> Connexion…
        } @else { Se connecter }
      </button>
    </form>
  </div>
</div>
