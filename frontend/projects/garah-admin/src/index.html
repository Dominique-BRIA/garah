<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>GARAH — Administration</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Deux déclarations, et l'ordre compte peu : un navigateur qui sait lire
       le SVG le préfère et reste net à toutes les tailles ; les autres
       retombent sur le .ico sans qu'on ait à les détecter. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">

  <!--
    L'écran d'attente, écrit ICI et pas dans un composant.

    ⚠️ Il doit s'afficher AVANT qu'Angular ne démarre. Un composant Angular ne
       le pourrait pas : entre le chargement de la page et le premier rendu,
       il s'écoule le temps de télécharger et d'exécuter le code — puis, si
       une route attend le réseau, le temps de cette attente.

       Sans ces quelques lignes, la page reste BLANCHE pendant tout ce temps,
       et l'utilisateur conclut que l'application est cassée.

    Angular remplace le contenu de <ga-root> à son premier rendu : rien à
    nettoyer, et aucun risque que l'écran d'attente reste affiché.

    Les couleurs sont en dur, et c'est le seul endroit du projet où c'est
    justifié : les variables de thème vivent dans la feuille de style, qui
    n'est pas forcément arrivée quand ceci s'affiche.
  -->
  <style>
    .demarrage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #f8fafc;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      .demarrage { background: #0c0c14; }
      .demarrage__mot { color: #f3f4f6; }
    }

    /* Le mot est neutre, l'emblème vert porte seul la couleur.

       ⚠️ Cet écran ne peut PAS suivre la bascule manuelle du thème : elle est
          rangée par l'application, qui n'a pas encore démarré. On suit donc le
          réglage du système, comme le fait déjà le fond juste au-dessus. Un
          blanc en dur laisserait le mot invisible chez qui est en thème
          clair. */
    .demarrage__mot {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #0f172a;
    }

    /* La marque remplace l'anneau qui tournait ici.

       Elle dit la même chose — il se passe quelque chose — mais elle le dit
       avec la marque, et l'écran d'attente cesse d'être un écran générique.
       Le dessin est recopié ici plutôt qu'importé : une requête de plus, à
       l'instant précis où l'on essaie d'afficher quelque chose vite, irait
       contre le but de cet écran. */
    .demarrage__marque {
      width: 3.25rem;
      height: 3.25rem;
      display: block;
    }

    /* Le niveau monte, tient en haut, redescend. Le palier est ce qui
       distingue une respiration d'un va-et-vient mécanique. */
    #demarrage-niveau-rect {
      animation: demarrage-remplir 2s ease-in-out infinite;
    }

    @keyframes demarrage-remplir {
      0% { transform: translateY(17px); }
      45%, 60% { transform: none; }
      100% { transform: translateY(17px); }
    }

    /* Le réglage système « réduire les animations » vaut aussi ici : la marque
       doit alors apparaître ENTIÈRE, jamais figée à mi-remplissage. */
    @media (prefers-reduced-motion: reduce) {
      #demarrage-niveau-rect { animation: none; transform: none; }
    }
  </style>
</head>
<body>
  <ga-root>
    <div class="demarrage">
      <svg class="demarrage__marque" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="demarrage-niveau">
            <rect id="demarrage-niveau-rect" x="8" y="24" width="34" height="18" />
          </clipPath>
        </defs>
        <!-- Le vert de la marque, recopié en dur : c'est le seul endroit du
             projet où c'est justifié, la feuille de style qui porte
             `--marque` n'est pas forcément arrivée quand ceci s'affiche.
             Si la charte change, cette valeur change AUSSI. -->
        <path d="M10 25A15 15 0 0 1 37.29 16.4" fill="none" stroke="#12a594"
              stroke-width="5" />
        <path d="M10 25A15 15 0 0 0 40 25Z" fill="#12a594"
              clip-path="url(#demarrage-niveau)" />
      </svg>
      <span class="demarrage__mot">GARAH</span>
    </div>
  </ga-root>
</body>
</html>
