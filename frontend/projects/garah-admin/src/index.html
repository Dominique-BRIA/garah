<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>GARAH — Administration</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Deux déclarations, et l'ordre compte peu : un navigateur qui sait lire
       le SVG le préfère et reste net à toutes les tailles ; les autres
       retombent sur le .ico sans qu'on ait à les détecter. -->
  <!-- ⚠️ L'ORDRE COMPTE, et il est contre-intuitif.
       Le .ico se déclare EN PREMIER, le SVG ENSUITE. Un navigateur qui
       comprend les deux retient la dernière déclaration qu'il sait lire :
       en mettant le SVG d'abord, c'est le vieux .ico qui gagnait, et
       l'onglet gardait l'ancienne icône alors que le fichier vert était
       parfaitement servi.

       Le .ico reste pour les navigateurs qui ignorent le SVG. `sizes="any"`
       sur le SVG dit qu'il vaut pour toutes les tailles — c'est ce qui le
       fait préférer sur les moteurs qui arbitrent par taille. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">

  <!-- ⚠️ iOS N'ACCEPTE PAS la transparence sur cette icône : il remplit le
       fond en NOIR. Le fichier porte donc son fond nuit dessiné, et non
       laissé au hasard. C'est aussi pour cela qu'il n'y en a qu'une taille :
       iOS redimensionne très bien, mais ne compose pas de fond. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">

  <!-- La couleur de la barre système quand l'application est installée. -->
  <meta name="theme-color" content="#101C3D">

  <!--
    L'écran d'attente, écrit ICI et pas dans un composant.

    ⚠️ Il doit s'afficher AVANT qu'Angular ne démarre. Un composant Angular ne
       le pourrait pas : entre le chargement de la page et le premier rendu,
       il s'écoule le temps de télécharger et d'exécuter le code — puis, si
       une route attend le réseau, le temps de cette attente.

       Sans ces quelques lignes, la page reste BLANCHE pendant tout ce temps,
       et l'utilisateur conclut que l'application est cassée.

    Angular remplace le contenu de <ga-root> à son premier rendu : rien à
    nettoyer, et aucun risque que l'écran d'attente reste affiché.

    Les couleurs sont en dur, et c'est le seul endroit du projet où c'est
    justifié : les variables de thème vivent dans la feuille de style, qui
    n'est pas forcément arrivée quand ceci s'affiche.
  -->
  <style>
    .demarrage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #f8fafc;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      .demarrage { background: #0c0c14; }
      .demarrage__mot { color: #f3f4f6; }
    }

    /* Le mot est neutre, l'emblème vert porte seul la couleur.

       ⚠️ Cet écran ne peut PAS suivre la bascule manuelle du thème : elle est
          rangée par l'application, qui n'a pas encore démarré. On suit donc le
          réglage du système, comme le fait déjà le fond juste au-dessus. Un
          blanc en dur laisserait le mot invisible chez qui est en thème
          clair. */
    .demarrage__mot {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #0f172a;
    }

    /* La marque remplace l'anneau qui tournait ici.

       Elle dit la même chose — il se passe quelque chose — mais elle le dit
       avec la marque, et l'écran d'attente cesse d'être un écran générique.
       Le dessin est recopié ici plutôt qu'importé : une requête de plus, à
       l'instant précis où l'on essaie d'afficher quelque chose vite, irait
       contre le but de cet écran. */
    .demarrage__marque {
      width: 3.25rem;
      height: 3.25rem;
      display: block;
    }

    /* La marque respire : elle pâlit, revient, tient en haut, repart. Le
       palier est ce qui distingue une respiration d'un va-et-vient mécanique.

       ⚠️ L'ancienne animation faisait MONTER UN NIVEAU dans la panse de la
          calebasse — un rectangle de découpage qu'on translatait. Le dessin
          actuel est une surface pleine percée de trous : un niveau qui monte
          n'y veut rien dire, et le découpage aurait rogné le panier au
          hasard. */
    .demarrage__marque {
      animation: demarrage-respirer 2s ease-in-out infinite;
    }

    @keyframes demarrage-respirer {
      0% { opacity: 0.5; transform: scale(0.93); }
      45%, 60% { opacity: 1; transform: none; }
      100% { opacity: 0.5; transform: scale(0.93); }
    }

    /* Le réglage système « réduire les animations » vaut aussi ici : la marque
       doit alors apparaître ENTIÈRE, jamais figée à mi-course. */
    @media (prefers-reduced-motion: reduce) {
      .demarrage__marque { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

           `--marque` n'est pas forcément arrivée quand ceci s'affiche.
           Si la charte change, cette valeur change AUSSI. -->
      <svg class="demarrage__marque" viewBox="0 0 313 457" aria-hidden="true" focusable="false">

      </svg>
      <span class="demarrage__mot">GARAH</span>
    </div>
  </ga-root>
</body>
</html>
