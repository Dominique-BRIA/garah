<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     role="img" aria-label="GARAH">
  <title>GARAH</title>
  <!--
    La marque GARAH : la calebasse, ramenee a sa panse et a son anse.

    /!\ CE FICHIER EST POUR L'EXTERIEUR de l'application : e-mail, README,
        document imprime, outil tiers. Le vert y est ecrit en dur parce qu'il
        n'y a aucune feuille de style pour fournir var(--marque).

        DANS l'application, utiliser <gu-marque /> : la couleur y vient du
        jeton, et le jour ou la charte change, elle change a UN seul endroit.
        Ce fichier-ci est alors a remettre a jour a la main.
  -->
  <path d="M10 25A15 15 0 0 1 37.29 16.4" fill="none" stroke="#12a594"
        stroke-width="5" stroke-linecap="butt"/>
  <path d="M10 25A15 15 0 0 0 40 25Z" fill="#12a594"/>
</svg>
