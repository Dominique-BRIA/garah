# =============================================================================
# Blueprint Render — l'API GARAH
# =============================================================================
# Ce fichier décrit le service. Render le lit à chaque push sur `main` et
# applique la différence.
#
# 📌 Pourquoi un fichier versionné plutôt que des clics dans l'interface :
#    un service configuré à la main n'existe que dans la tête de celui qui
#    l'a créé. Ici, la configuration est relue, commentée, et se restaure à
#    l'identique le jour où l'instance est perdue.
#
# ⚠️ Ce blueprint ne décrit QUE l'API. Les trois frontends Angular vont sur
#    Vercel (D-14), et la base sur Neon — chacun garde sa propre définition.
# =============================================================================

services:
  - type: web
    name: garah-api
    runtime: docker
    plan: free
    region: frankfurt          # le plus proche du Cameroun parmi les régions gratuites

    # Le Dockerfile vit dans backend/, mais le dépôt contient aussi docs/ et,
    # bientôt, les trois applications Angular. On dit donc explicitement où
    # regarder — sinon Render enverrait tout le dépôt au démon Docker.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    branch: main
    autoDeploy: true

    # Render redéploie tant que cette adresse ne répond pas 200. Sans elle, une
    # instance qui démarre mais dont Flyway a échoué serait annoncée « live ».
    healthCheckPath: /api/sante

    envVars:
      # --- Base de données (Neon) ------------------------------------------
      # sync: false = Render demande la valeur au premier déploiement et la
      # chiffre. Elle n'apparaît JAMAIS dans ce fichier, donc jamais dans git.
      - key: GARAH_DB_URL
        sync: false
      - key: GARAH_DB_USER
        sync: false
      - key: GARAH_DB_PASSWORD
        sync: false

      # Neon compte les connexions, et l'offre gratuite en accorde peu.
      # 5 par instance laisse de la marge pour une seconde instance et pour
      # la console SQL.
      - key: GARAH_DB_POOL_MAX
        value: "5"

      # --- Sécurité --------------------------------------------------------
      # generateValue: true = Render tire une valeur aléatoire et la garde.
      # C'est mieux qu'un secret choisi par un humain : personne ne le connaît,
      # donc personne ne peut le divulguer.
      #
      # ⚠️ Le changer invalide tous les jetons en circulation : les clients
      #    connectés sont déconnectés. C'est le comportement voulu.
      - key: GARAH_JWT_SECRET
        generateValue: true

      # 15 minutes, pas 60 (D-19). Un JWT ne se revoque pas : sa duree de vie
      # EST le delai pendant lequel un droit retire, ou un compte bloque,
      # reste effectif. Le jeton de rafraichissement ci-dessous rend cette
      # duree courte supportable pour l'utilisateur.
      - key: GARAH_JWT_EXPIRATION_MINUTES
        value: "15"
      - key: GARAH_REFRESH_EXPIRATION_JOURS
        value: "14"

      # --- Le cookie de rafraichissement (D-19) ----------------------------
      # /!\ SameSite=None est OBLIGATOIRE tant que les frontends sont sur
      #     Vercel et l'API sur Render : ce sont deux SITES differents pour le
      #     navigateur. Avec Strict ou Lax, le cookie ne partirait jamais, et
      #     le symptome serait une deconnexion toutes les 15 minutes SANS
      #     aucune erreur serveur.
      #
      #     Le jour d'un vrai domaine (api.garah.cm + app.garah.cm), passer a
      #     Lax : la protection CSRF devient structurelle.
      - key: GARAH_COOKIE_SAMESITE
        value: "None"
      - key: GARAH_COOKIE_SECURE
        value: "true"
      - key: GARAH_COOKIE_DOMAIN
        sync: false

      # --- Stockage des fichiers (Backblaze B2) -----------------------------
      # Seul le préfixe public est en clair : il figure de toute façon dans
      # chaque URL d'image. Les clés d'accès, elles, sont demandées.
      - key: GARAH_MEDIA_BASE_URL
        sync: false
      - key: GARAH_S3_ENDPOINT
        sync: false
      # Backblaze annonce une region comme eu-central-003, que le SDK AWS ne
      # connait pas. Elle ne sert qu'a la signature, jamais au routage — c'est
      # l'endpoint ci-dessus qui decide ou l'on va. Elle manquait ici alors que
      # le code la lit : sans elle, la signature est calculee sur us-east-1 et
      # Backblaze refuse chaque televersement.
      - key: GARAH_S3_REGION
        sync: false
      - key: GARAH_S3_BUCKET
        sync: false
      # /!\ PAS la cle maitresse : Backblaze ne l'accepte pas sur l'API S3.
      #     Creer une cle dans Account -> Application Keys, limitee au bucket.
      - key: GARAH_S3_ACCESS_KEY
        sync: false
      - key: GARAH_S3_SECRET_KEY
        sync: false

      # --- Bucket prive : URL signees (D-21) --------------------------------
      # /!\ true tant que le bucket est PRIVE.
      #
      #     Un bucket prive accepte les televersements sans broncher : le
      #     back-office marche, et seules les images vues par un VISITEUR
      #     repondent 401 — sans aucune erreur dans les journaux.
      #
      #     Repasser a false le jour ou le bucket devient public. Rien d'autre
      #     ne change, ni cote API ni cote frontend.
      - key: GARAH_S3_URLS_SIGNEES
        value: "true"
      # 7 jours = maximum autorise par AWS SigV4.
      - key: GARAH_S3_SIGNATURE_JOURS
        value: "7"

      # --- Les trois frontends ---------------------------------------------
      # À compléter avec les domaines Vercel réels. Tant que c'est faux, l'API
      # répond correctement et le navigateur refuse de livrer la réponse : le
      # symptôme est une page vide sans erreur serveur.
      - key: GARAH_CORS_ORIGINS
        sync: false

      # --- Amorçage du premier SuperAdmin -----------------------------------
      # À renseigner pour le PREMIER déploiement, puis à SUPPRIMER de
      # l'environnement une fois le compte créé et le mot de passe changé.
      # Laisser un mot de passe d'amorçage en place, c'est laisser une clé
      # sous le paillasson.
      - key: GARAH_SUPERADMIN_EMAIL
        sync: false
      - key: GARAH_SUPERADMIN_MOT_DE_PASSE
        sync: false

      # --- Paiement (Campay) ------------------------------------------------
      # Sandbox tant qu'on teste. Basculer sur https://www.campay.net/api
      # uniquement quand un vrai encaissement est voulu — se tromper ici
      # signifie débiter de vrais clients avec du code non éprouvé.
      - key: GARAH_CAMPAY_BASE_URL
        value: https://demo.campay.net/api
      - key: GARAH_CAMPAY_APP_USERNAME
        sync: false
      - key: GARAH_CAMPAY_APP_PASSWORD
        sync: false

      # Clé de signature des notifications entrantes.
      #
      # 🎯 Ce n'est PAS elle qui protège le webhook — contrairement à ce que
      #    disait ce fichier avant la mise en service de l'API.
      #
      #    Le webhook ne croit rien de ce qu'on lui envoie : il n'en retient
      #    qu'une référence de transaction, puis redemande l'état réel à Campay
      #    sur une connexion que NOUS ouvrons, avec NOS identifiants. Poster une
      #    notification forgée ne permet ni de déclarer une commande payée, ni
      #    d'en changer le montant.
      #
      #    La signature reste une défense supplémentaire. Le service démarre
      #    sans elle.
      - key: GARAH_CAMPAY_WEBHOOK_KEY
        sync: false

      # Refuser une notification dont la signature ne se vérifie pas.
      #
      # ⚠️ false tant que le format de signature n'a pas été confirmé avec
      #    Campay. L'activer à l'aveugle ferait rejeter TOUTES les
      #    notifications — plus aucune commande payée, et aucune erreur
      #    visible côté client pour le signaler.
      #
      #    Les journaux disent à chaque notification si la signature se
      #    vérifie. Passer à "true" seulement quand ils disent "signature=ok".
      - key: GARAH_CAMPAY_WEBHOOK_STRICT
        value: "false"

      # --- Divers -----------------------------------------------------------
      - key: GARAH_VERSION
        value: "0.1.0"
      # Le fuseau du serveur ne doit jamais influencer un calcul : tout est
      # stocké en UTC (chapitre 05). On le fixe pour que les journaux soient
      # lisibles sans conversion mentale.
      - key: TZ
        value: UTC
