# =============================================================================
# Deploiement du backend sur Azure App Service
# =============================================================================
# L application Azure est configuree en CONTENEUR Linux (linuxFxVersion
# DOCKER|...), et c est le bon choix : la pile « Java SE » d App Service ne
# propose pas Java 24, que ce projet utilise. Le Dockerfile existant sert donc
# tel quel — celui-la meme qui tournait sur Render.
#
# -----------------------------------------------------------------------------
# Pourquoi GHCR et pas Azure Container Registry
# -----------------------------------------------------------------------------
# ACR Basic coute environ 5 $/mois. Sur un credit etudiant de 100 $ deja
# entame par le plan B1, c est 60 $ par an pour heberger des images que GitHub
# stocke gratuitement, a cote du code qui les produit.
#
# -----------------------------------------------------------------------------
# /!\ CE WORKFLOW NE DEPLOIE QUE SI LES TESTS PASSENT
# -----------------------------------------------------------------------------
# `needs: tests` n est pas une precaution de style. Le conteneur qui part ici
# rejoue les migrations Flyway sur la base de PRODUCTION au demarrage : une
# migration cassee ne se rattrape pas, il n existe pas de bouton « annuler ».
# =============================================================================

name: Deploiement Azure

on:
  push:
    branches: [main]
    # -------------------------------------------------------------------------
    # /!\ CE FILTRE EST UNE PROTECTION, PAS UNE ECONOMIE.
    # -------------------------------------------------------------------------
    #     Sans lui, un commit qui ne touche QUE le frontend redeployait le
    #     backend — et le conteneur qui part rejoue les migrations Flyway sur
    #     la base de PRODUCTION au demarrage. Redeployer pour rien, c est
    #     s exposer pour rien.
    #
    #     Il rend aussi inutile de separer le depot en deux branches : ce qui
    #     decide du declenchement, c est ce qui a CHANGE, pas ou on a pousse.
    paths:
      - 'backend/**'
      - '.github/workflows/deploiement-azure.yml'
  # Permet de redeployer sans commit — utile apres avoir change une variable
  # d environnement dans le portail.
  workflow_dispatch:

env:
  # /!\ EN MINUSCULES, ET ECRIT EN DUR.
  #
  #     `github.repository_owner` vaut « Dominique-BRIA » — avec ses
  #     majuscules. Un registre Docker les REFUSE : la reference est jugee
  #     invalide, et l erreur ne parle ni de casse ni de proprietaire.
  #
  #     Le deriver demanderait un `tr '[:upper:]' '[:lower:]'` dans chacun des
  #     deux jobs qui s en servent — donc deux endroits a garder d accord. Une
  #     seule ligne en dur, commentee, vaut mieux ici.
  IMAGE: ghcr.io/dominique-bria/garah-api
  # Le nom de l application, pas son nom d hote : Azure ajoute un suffixe
  # aleatoire au domaine (`autoGeneratedDomainNameLabelScope: TenantReuse`).
  APPLICATION: garah-api

jobs:
  # ---------------------------------------------------------------------------
  # 1. La meme barriere que le CI : compilation et 284 tests sur base vierge
  # ---------------------------------------------------------------------------
  tests:
    name: Compilation et tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: garah_app
          POSTGRES_PASSWORD: motdepasse_ci
          POSTGRES_DB: garah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Lancer les tests
        working-directory: backend
        env:
          GARAH_TEST_DB_URL: jdbc:postgresql://localhost:5432/garah_test
          GARAH_DB_USER: garah_app
          GARAH_DB_PASSWORD: motdepasse_ci
        run: mvn -B -ntp test

  # ---------------------------------------------------------------------------
  # 2. Construire l image et la pousser
  # ---------------------------------------------------------------------------
  image:
    name: Image du conteneur
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Indispensable pour pousser sur ghcr.io avec le GITHUB_TOKEN integre :
      # sans elle, le push echoue en 403 alors que la connexion a reussi.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # /!\ INDISPENSABLE POUR LE CACHE.
      #
      #     Sans buildx, le runner utilise le pilote `docker` par defaut, qui
      #     ne sait PAS exporter de cache :
      #         « Cache export is not supported for the docker driver »
      #
      #     Le build echoue alors AVANT meme de construire quoi que ce soit,
      #     sur une erreur qui ne mentionne pas l action fautive.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # DEUX etiquettes, et les deux comptent.
          #
          #   :sha    l image exacte de ce commit — c est elle qu on deploie,
          #           et c est elle qui permet de revenir en arriere
          #   :latest le raccourci pour un `docker pull` a la main
          #
          # Deployer `:latest` serait une erreur : App Service ne saurait plus
          # quelle version tourne, et un redemarrage pourrait ramener une autre
          # image que celle qu on croit.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Le cache de couches evite de retelecharger Spring Boot a chaque
          # execution : le Dockerfile copie le pom avant les sources exactement
          # pour ca.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. Pointer l application sur la nouvelle image
  # ---------------------------------------------------------------------------
  deploiement:
    name: Mise en ligne
    needs: image
    runs-on: ubuntu-latest

    steps:
      - name: Deployer sur App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APPLICATION }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ github.sha }}

      # Le deploiement rend la main des qu Azure a accepte l image, pas quand
      # l application repond. Sans cette verification, un demarrage qui echoue
      # laisse un workflow VERT devant une application morte.
      - name: Verifier que l application repond
        run: |
          echo "Attente du demarrage (jusqu a 5 minutes)..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                   "${{ secrets.AZURE_URL_SANTE }}" || true)
            if [ "$code" = "200" ]; then
              echo "L application repond (HTTP 200) apres environ $((i*10))s."
              exit 0
            fi
            echo "  tentative $i : HTTP $code"
            sleep 10
          done
          echo "::error::L application n a pas repondu 200 en 5 minutes."
          exit 1

      # Un echec de demarrage ne dit RIEN par lui-meme : le workflow s arrete
      # sur un code HTTP, et la cause est cote Azure. Ces trois lignes
      # remplacent une heure de recherche a l aveugle — dans l ordre de
      # frequence reelle.
      - name: Ou chercher si ca a echoue
        if: failure()
        run: |
          cat <<'FIN'
          ::group::Les trois causes, par ordre de frequence
          1. L IMAGE N A PAS PU ETRE TIREE
             Le paquet ghcr.io est prive par defaut au premier passage.
             Verifier DOCKER_REGISTRY_SERVER_USERNAME / _PASSWORD dans
             Variables d environnement, ou rendre le paquet public.
             Signature : « Application Error » et AUCUN journal applicatif.

          2. WEBSITES_PORT MANQUE OU VAUT AUTRE CHOSE QUE 8080
             App Service devine alors le port et se trompe. L application
             demarre normalement, mais rien ne lui parvient.
             Signature : journaux applicatifs COMPLETS, « Started
             GarahApplication », et pourtant 502 ou 504 de l exterieur.

          3. UNE VARIABLE GARAH_* MANQUE
             GARAH_JWT_SECRET de moins de 32 octets, GARAH_DB_URL absente :
             l application refuse de demarrer, et elle le DIT.
             Signature : la pile d erreur est dans le flux de journaux.

          Les journaux : portail > garah-api > Flux de journaux
          Ou : az webapp log tail --name garah-api --resource-group <groupe>
          ::endgroup::
          FIN
