# =============================================================================
# Relais GARAH -> MoneyFusion (D-55)
# =============================================================================
# MoneyFusion n accepte qu UNE IP declaree ; GARAH (Azure) sort par 25 IP.
# Ce relais donne a GARAH une IP fixe : celle de ce serveur.
#
# Proxy CONNECT uniquement : le TLS va de GARAH jusqu a MoneyFusion. Ce serveur
# ne voit que des octets chiffres, ni le lien secret ni les paiements.
#
# N ouvre que vers *.moneyfusion.net:443, et n accepte que les IP d Azure.
# Installe le 10/10/2026 ; ne touche a rien d autre sur ce serveur.
# Original de la distribution : tinyproxy.conf.orig
# =============================================================================
User tinyproxy
Group tinyproxy
Port 18443
Timeout 60
MaxClients 20
DefaultErrorFile "/usr/share/tinyproxy/default.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Notice
PidFile "/run/tinyproxy/tinyproxy.pid"
DisableViaHeader Yes
XTinyproxy No

ConnectPort 443
Filter "/etc/tinyproxy/filtre-garah"
FilterURLs Off
FilterType ere
FilterDefaultDeny Yes

Allow 127.0.0.1
Allow 20.74.98.94
Allow 20.74.99.185
Allow 20.74.103.51
Allow 20.74.100.242
Allow 20.199.57.213
Allow 20.199.57.232
Allow 20.199.58.59
Allow 20.199.58.89
Allow 20.199.58.126
Allow 20.199.58.168
Allow 20.199.59.28
Allow 20.199.59.61
Allow 20.199.59.119
Allow 20.199.59.124
Allow 20.199.59.125
Allow 20.199.59.143
Allow 20.199.59.181
Allow 20.199.59.213
Allow 20.199.59.232
Allow 20.199.59.252
Allow 20.199.60.91
Allow 20.199.60.96
Allow 20.199.60.102
Allow 51.138.218.218
Allow 20.111.1.11
