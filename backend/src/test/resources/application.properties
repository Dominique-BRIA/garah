# Configuration des tests automatises.
#
# Les tests tournent sur une VRAIE base PostgreSQL (garah_test), jamais sur H2 :
# les index uniques partiels, les contraintes d'exclusion, les CTE et les
# triggers qui protegent GARAH n'existent pas en H2. Un test qui passe sur H2
# et echoue en production est pire qu'un test absent.
#
# Le mot de passe vient de l'environnement, comme en developpement.
# Avant de lancer les tests :  $env:GARAH_DB_PASSWORD='...'
#
# =============================================================================
# /!\ LES TESTS ONT LEURS PROPRES IDENTIFIANTS, ET C'EST VITAL
# =============================================================================
# Ces trois lignes lisaient GARAH_DB_USER et GARAH_DB_PASSWORD, c'est-a-dire
# EXACTEMENT les memes variables que la production. Tant que la base de
# developpement etait un PostgreSQL local, personne ne pouvait s'en apercevoir.
#
# Le jour ou GARAH_DB_* pointe vers Neon, deux choses cassent d'un coup :
#
#   1. les tests tentent de joindre localhost avec le mot de passe Neon
#      -> echec d'authentification sur les 202 tests ;
#
#   2. et si quelqu'un "corrige" en pointant GARAH_TEST_DB_URL vers Neon,
#      c'est bien pire : les tests font des DELETE, creent des comptes et
#      rejouent les migrations. Ils DETRUIRAIENT la base de production.
#
# D'ou GARAH_TEST_DB_USER / GARAH_TEST_DB_PASSWORD, distincts. Le repli garde
# l'ancien comportement pour qui utilise le meme utilisateur local partout :
# rien a changer tant qu'on developpe en local.
#
# La regle : une variable partagee entre deux environnements n'est pas une
# economie, c'est une bombe a retardement. Elle attend qu'un seul des deux
# change.
# =============================================================================

spring.datasource.url=${GARAH_TEST_DB_URL:jdbc:postgresql://localhost:5432/garah_test}
spring.datasource.username=${GARAH_TEST_DB_USER:${GARAH_DB_USER:garah_app}}
spring.datasource.password=${GARAH_TEST_DB_PASSWORD:${GARAH_DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Utile pendant l'apprentissage : voir les requetes reellement executees,
# notamment pour reperer un probleme N+1.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO

# Secret de signature propre aux tests. Il doit faire au moins 32 octets :
# HMAC-SHA256 refuse une cle plus courte, et Spring echouerait au demarrage.
# Ce secret n'a aucune valeur : il ne signe que des jetons de test.
GARAH_JWT_SECRET=secret_de_test_uniquement_32_octets_minimum_0123456789
GARAH_JWT_EXPIRATION_MINUTES=60

# Les traitements periodiques sont COUPES pendant les tests.
#
# Sans cette ligne, la reconciliation des paiements partirait toutes les deux
# minutes pendant la suite, appellerait Campay (non configure), et polluerait
# les journaux d'erreurs de chaque execution. Pire : la liberation des
# commandes impayees pourrait annuler, en pleine assertion, une commande qu'un
# test venait de creer — un echec intermittent, le plus couteux a diagnostiquer.
#
# Les taches sont testees en les APPELANT directement, jamais en attendant
# qu'un planificateur les declenche.
garah.planification.active=false
